name: "LoRaWAN Add-on"
description: "A complete LoRaWAN Network Server with Chirpstack"
version: "0.0.6"
slug: "lorawan"
url: "https://github.com/karmao1979/addon-lorawan"
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: services
ports:
  8080/tcp: 8080
  1700/udp: 1700
devices: 
  - /dev/ttyACM0
udev: true
options:
  region: US915
  latitude: 0
  longitude: 0
  altitude: 0
schema:
  region: list(US915|EU868|AS923)
  latitude: float
  longitude: float
  altitude: float
